# Scout: runs overnight and proposes what to build next.
name: scout
title: Scout
icon: "🔭"
color: "#64748b"
description: >
  Runs each night while you sleep. Reads the code, docs, open TODOs, failing
  tests and the product plans in docs/, then proposes a few small, valuable
  features or fixes as new requests for you to approve in the morning.

model: claude-opus-5-5
effort: high
prompt: prompts/scout.md
tools: [Read, Grep, Glob, Bash]
disallowed_tools: ["Bash(git push:*)", "Bash(git commit:*)", "Bash(gh:*)"]
workspace: read
budget_usd: 3
# Returns new feature requests, not a pipeline decision.
proposes: true

context: [issue]

decisions:
  proposed: Found work worth doing and proposed it.
  nothing: Nothing worth proposing tonight.
