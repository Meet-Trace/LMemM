# Checks factory changes: the config stays valid and the engine's tests pass.
name: factory-ci

on:
  pull_request:
    paths: ["factory/**", ".github/workflows/factory*.yml"]
  push:
    branches: [main]
    paths: ["factory/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml
      - run: python -m factory validate
      - run: python -m unittest discover -s factory/tests -t .
