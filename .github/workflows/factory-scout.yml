# Overnight: the scout agent proposes what to build next. Proposals are filed as
# issues labelled factory:proposed; add the `factory` label to approve one.
name: factory-scout

on:
  schedule:
    # 20:30 UTC = 02:00 India time.
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: factory-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_VERSION: "2.1.330"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the factory and Claude Code
        run: |
          python -m pip install --quiet pyyaml
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Run the scout
        run: python -m factory scout
