# Implement: writes the code and tests that satisfy the spec.
name: implement
title: Implement
icon: "🛠️"
color: "#f59e0b"
description: >
  Builds the change on the feature branch: code, tests and docs that satisfy
  the spec. When review or verify sends work back, it fixes exactly what they
  found.

model: claude-opus-5-5
effort: high
prompt: prompts/implement.md
tools: [Read, Grep, Glob, Write, Edit, Bash]
# The orchestrator commits and pushes; the agent must not.
disallowed_tools: ["Bash(git push:*)", "Bash(git commit:*)", "Bash(gh:*)"]
workspace: write
budget_usd: 10

context: [issue, comments, reports, diff]

decisions:
  done: The change is built and its tests pass locally.
  blocked: Cannot finish without a decision or access from the requester.
